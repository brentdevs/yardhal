name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision pinned Ergo server
        run: bash scripts/ensure-ergo.sh
      - name: Build
        timeout-minutes: 10
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Lint
        timeout-minutes: 10
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Unit and Ergo tests
        timeout-minutes: 10
        run: |
          cat > "$RUNNER_TEMP/ci-test-progress.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  beforeTest { descriptor ->
                      logger.lifecycle("START ${descriptor.className}.${descriptor.name}")
                  }
                  afterTest { descriptor, result ->
                      logger.lifecycle("END ${descriptor.className}.${descriptor.name}: ${result.resultType}")
                  }
              }
          }
          EOF
          ./gradlew test --init-script "$RUNNER_TEMP/ci-test-progress.gradle" --stacktrace
      - name: Upload reports after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.txt
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version tag and commit
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag must point to a commit on main"
            exit 1
          }
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.YARDHAL_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.YARDHAL_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Release signing secrets are missing"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yardhal-release.jks"
          chmod 600 "$RUNNER_TEMP/yardhal-release.jks"
      - name: Build signed release APK
        env:
          YARDHAL_RELEASE_KEYSTORE: ${{ runner.temp }}/yardhal-release.jks
          YARDHAL_RELEASE_KEY_PASSWORD: ${{ secrets.YARDHAL_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PyardhalVersionName="${GITHUB_REF_NAME#v}" \
            -PyardhalVersionCode="$GITHUB_RUN_NUMBER" \
            --stacktrace
      - name: Verify APK and checksum
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk")
          if [[ "$certificate" != *"SHA-256 digest: 5cea23302470a3160c662615605088f7fbb52e58a778c0eb8f7efc9d98385d31"* ]]; then
            echo "::error::APK was signed with an unexpected certificate"
            exit 1
          fi
          package_line=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1p')
          if [[ "$package_line" != *"name='dev.brentdevs.yardhal' versionCode='$GITHUB_RUN_NUMBER' versionName='${GITHUB_REF_NAME#v}'"* ]]; then
            echo "::error::APK package or version does not match the release tag"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/yardhal-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum "yardhal-${GITHUB_REF_NAME}.apk" > "yardhal-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/yardhal-${GITHUB_REF_NAME}.apk" \
            "dist/yardhal-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag --generate-notes --title "Yardhal $GITHUB_REF_NAME"
